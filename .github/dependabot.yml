version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mui:
        patterns: ['@mui/*', '@emotion/*']
        update-types: ['minor', 'patch']
      react:
        patterns: ['react', 'react-dom', 'react-router-dom', '@types/react', '@types/react-dom']
        update-types: ['minor', 'patch']
      build:
        patterns: ['vite', '@vitejs/plugin-react', 'rollup', 'rollup-plugin-dts']
        update-types: ['minor', 'patch']
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - '@playwright/test'
          - 'jsdom'
          - 'fast-check'
          - 'jest-axe'
          - '@types/jest-axe'
          - '@axe-core/playwright'
        update-types: ['minor', 'patch']
      lint:
        patterns: ['eslint', '@eslint/js', 'typescript-eslint', 'eslint-*', 'prettier', 'knip', 'globals']
        update-types: ['minor', 'patch']
      types:
        patterns: ['typescript', '@types/node']
        update-types: ['minor', 'patch']
      release:
        patterns: ['semantic-release', '@semantic-release/*']
        update-types: ['minor', 'patch']
      tooling:
        patterns: ['*']
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: scope
