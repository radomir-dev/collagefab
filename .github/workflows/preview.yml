name: PR preview

# The same demo the Pages workflow publishes, deployed one directory deeper so each pull
# request gets its own copy. The preview action removes it again when the pull request
# closes, and comments the URL on the pull request.
#
# There is deliberately no base-branch filter: a stacked pull request targets another
# branch rather than main, and it needs a preview just as much.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token, so it could neither publish a
    # preview nor remove one; the alternative trigger would run fork code with write
    # access, which is the trade the preview action declines to make.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # The preview is served under the deployment's own /mui-collage-fab/ prefix plus the
      # umbrella directory and the PR number, so the asset URLs have to be built for that
      # path rather than for the deployment root.
      - name: Build the demo for the preview path
        if: github.event.action != 'closed'
        env:
          SITE_BASE_PATH: /mui-collage-fab/pr-preview/pr-${{ github.event.number }}/
        run: npm run build:preview

      # `action` is left at its default, which deploys on every event but `closed` and
      # removes the preview directory on `closed`.
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: ./dist
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          # Pages serves this project from the account's custom domain, so the action's
          # *.github.io default would hand out a URL that only redirects. It prepends
          # `https://` itself, so this is the bare host and path.
          pages-base-url: radomir.dev/mui-collage-fab
          qr-code: false
