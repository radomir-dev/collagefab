name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed] # rebuild from the bump commit so __APP_VERSION__ matches the release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The preview workflow publishes per-pull-request copies into the same branch, so this
      # deploy rebases onto what is already there and keeps the umbrella directory, rather
      # than replacing the branch with a tree that holds only the new build.
      - name: Publish the site to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          force: false
